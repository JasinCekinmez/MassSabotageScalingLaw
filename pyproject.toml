[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mass-sabotage-scaling-law"
version = "0.1.0"
description = "Experiments and analysis for adversarial influence in multi-agent LLM deliberation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Addison J. Wu"},
    {name = "Jasin Cekinmez"},
    {name = "Michel Liao"},
    {name = "Karthik Narasimhan"},
    {name = "Thomas L. Griffiths"},
]
dependencies = [
    "anthropic>=0.75",
    "google-genai>=1.0",
    "openai>=1.75",
    "pyarrow>=15",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
analysis = [
    "jupyterlab>=4",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "statsmodels>=0.14",
]
benchmarks = ["pandas>=2.2"]
qualitative = ["docent>=0.1.87"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sabotage-run = "sabotage.run:main"
sabotage-analyze = "sabotage.analyze:main"
sabotage-probe = "sabotage.probe:main"

[project.urls]
Repository = "https://github.com/JasinCekinmez/MassSabotageScalingLaw"
Paper = "https://arxiv.org/abs/2609.30028"

[tool.setuptools.packages.find]
include = ["sabotage*", "elephant*", "persuasion_bench*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]
